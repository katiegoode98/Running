# Netlify picks these up automatically when the repo is imported.
#
# Credits: every production deploy costs credits, so keep the production
# branch set to `main` (Site configuration → Build & deploy → Branches) and
# turn off branch deploys and deploy previews if you don't need them.
[build]
  command = "npm run build"
  publish = "dist"
  # Netlify builds are switched OFF: the app is hosted on GitHub Pages instead
  # (free for this public repo). `exit 0` tells Netlify to skip every build, so
  # no deploys happen and no credits are used; the last deploy keeps serving.
  # To turn Netlify back on for app changes only, replace it with:
  #   git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json package-lock.json vite.config.ts tsconfig.json
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"

# Built JS/CSS filenames contain a content hash, so browsers can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always fetch the latest service worker and manifest so app updates reach the phone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
