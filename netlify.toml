# Netlify picks these up automatically when the repo is imported.
#
# Credits: every production deploy costs credits, so keep the production
# branch set to `main` (Site configuration → Build & deploy → Branches) and
# turn off branch deploys and deploy previews if you don't need them.
[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (and the deploy) when a commit doesn't change the app itself,
  # e.g. README, tests or workflow edits. Exit code 0 = skip, 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json package-lock.json vite.config.ts tsconfig.json"

[build.environment]
  NODE_VERSION = "22"

# Built JS/CSS filenames contain a content hash, so browsers can keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always fetch the latest service worker and manifest so app updates reach the phone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
